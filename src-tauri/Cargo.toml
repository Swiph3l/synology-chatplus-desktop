[package]
name = "chatplus-desktop"
version = "0.5.0"
description = "Unofficial community desktop client for Synology ChatPlus."
authors = ["Swiph3l"]
license = "GPL-3.0-only"
edition = "2021"
publish = false
repository = "https://github.com/Swiph3l/synology-chatplus-desktop"
homepage = "https://github.com/Swiph3l/synology-chatplus-desktop"


[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
semver = "1"
time = { version = "0.3", features = ["formatting"] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7.3"
webview2-com = "0.38"
windows = { version = "0.62", features = ["UI_Notifications"] }

[dev-dependencies]
base64 = "0.23.1"
minisign = "0.9.1"
rcgen = "0.14.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tauri = { version = "2.11", features = ["test"] }
