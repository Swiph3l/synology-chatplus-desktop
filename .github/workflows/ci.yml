name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-latest
            bundles: deb
          - os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - name: Validate configuration and package application
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Check Windows binary privacy
        if: runner.os == 'Windows'
        run: node scripts/check-binary-privacy.mjs
