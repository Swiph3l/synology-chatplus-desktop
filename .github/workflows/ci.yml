name: CI
on:
  push:
    branches: [main, beta/fixes, feature/**, fix/**]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: validate (${{ matrix.os }}, dev)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 xvfb
      - run: npm ci
      - name: Verify the glib backport source and resolved dependency
        run: node scripts/check-glib-backport.mjs --metadata
      - run: npm run check:dependencies
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
        if: runner.os != 'Linux'
      - run: xvfb-run -a cargo test --locked --manifest-path src-tauri/Cargo.toml
        if: runner.os == 'Linux'
      - name: Verify the optimized glib Variant iterator regression on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --release --locked --manifest-path src-tauri/Cargo.toml --test glib_variant_iter
      - name: Package the Linux compatibility candidate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm run tauri build -- --bundles appimage
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" -eq 1
          name=$(node scripts/release-targets.mjs --appimage-name)
          install -Dm755 "${images[0]}" "appimage-candidate/$name"
      - name: Upload the unsigned Linux candidate for startup tests
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-linux-x86_64
          path: appimage-candidate/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  appimage-compatibility:
    needs: validate
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/appimage-compatibility.yml
    with:
      artifact-name: unsigned-linux-x86_64
  frontend-node24:
    # Swiph3l: Cover Node 24 separately from the native platform matrix.
    name: frontend (ubuntu-latest, Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:release
