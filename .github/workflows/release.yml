name: Windows signed draft release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0
          # Swiph3l: Pin the event commit; a moved tag must fail source identity checks.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
          # Swiph3l: Signing keys/write grants must not share restored dependency caches.
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Validate tag, versions and production signing configuration
        run: node scripts/release-identity.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Require Windows x64 host
        run: |
          $hostInfo = rustc -vV
          if ($LASTEXITCODE -ne 0 -or $hostInfo -notcontains 'host: x86_64-pc-windows-msvc') { throw 'Windows x64 toolchain required.' }
      - name: Require Windows CI, CodeQL and security checks on the tagged commit
        run: node scripts/release-checks.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm audit
      - run: npm run build
      - run: npm run check:release
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      # Swiph3l: Only Windows is distributed; Linux/macOS remain experimental.
      - run: cargo deny --manifest-path src-tauri/Cargo.toml --config deny.toml --target x86_64-pc-windows-msvc --locked check
      - name: Build and sign updater packages
        run: npm run tauri build -- --bundles nsis
        env:
          CHATPLUS_RELEASE_BUILD: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Check Windows binary privacy
        run: node scripts/check-binary-privacy.mjs
      - name: Collect standalone application and signed setup
        run: node scripts/collect-release.mjs windows-x86_64
      - name: Verify collected updater signature with the production public key
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $env:CHATPLUS_SIGNED_ARTIFACT = (Resolve-Path -LiteralPath "release-artifacts/windows-x86_64--ChatPlus-Desktop_${releaseVersion}_x64-setup.exe").Path
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml updates::updater_tests::production_artifact_signature_verifies -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - run: npm run sbom -- security-output
      - name: Collect dependency evidence
        shell: pwsh
        env:
          RELEASE_TARGET: windows-x86_64
        run: |
          Get-ChildItem security-output | ForEach-Object { Copy-Item $_.FullName "release-artifacts/${env:RELEASE_TARGET}--$($_.Name)" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: signed-windows-x86_64
          path: release-artifacts/
          retention-days: 7
          if-no-files-found: error
          archive: true
          overwrite: false
          include-hidden-files: false
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 (Node 24)
        with:
          name: signed-windows-x86_64
          path: release-artifacts
          # Swiph3l: Fail corrupt transfers before generating updater metadata or a release draft.
          digest-mismatch: error
      - name: Generate actual updater metadata
        run: node scripts/release-metadata.mjs
      - run: node scripts/checksums.mjs release-artifacts
      - name: Attest public release artifacts
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-artifacts/*
      - name: Create draft only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          node scripts/release-identity.mjs --verify-remote-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Swiph3l: A plain SemVer tag is not stable-release approval; every new draft starts as a prerelease for separate review and promotion.
          $releaseArgs = @('release','create',$env:RELEASE_TAG,'--draft','--prerelease','--verify-tag','--title',"ChatPlus Desktop $env:RELEASE_TAG",'--notes-file','CHANGELOG.md')
          gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem release-artifacts -File | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Swiph3l: Publishing a draft is a separate maintainer action; never automatic.
