[graph]
# Audit the whole lockfile/platform graph; do not hide Linux advisories.
all-features = false

[advisories]
ignore = []
unmaintained = "all"
unsound = "all"
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "BSL-1.0", "GPL-3.0-only"]
confidence-threshold = 0.8
exceptions = [
  # Certificate dataset: permissive grant with license-text redistribution.
  # Original text is retained in third-party/webpki-root-certs-LICENSE.txt.
  { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
# The first-party GPL-3.0-only crate is checked alongside its dependencies.
# Third-party licensing is not changed by the project license.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
